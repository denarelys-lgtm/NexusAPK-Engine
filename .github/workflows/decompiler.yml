name: NexusAPK Pipeline

on:
  push:
    paths:
      - 'input_apk/**'
      - '.github/workflows/decompiler.yml'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  process-apk:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================
      - name: 1. Checkout del Repositorio
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 17
      # ==================================================
      - name: 2. Configurar Entorno Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==================================================
      # 3. INSTALAR JADX
      # ==================================================
      - name: 3. Instalar JADX CLI Moderno
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          INSTALACIÓN DE JADX"
          echo "=========================================="

          JADX_TAG=$(curl -fsSL \
            "https://api.github.com/repos/skylot/jadx/releases/latest" \
            | grep '"tag_name"' \
            | head -1 \
            | cut -d '"' -f 4)

          if [ -z "$JADX_TAG" ]; then
            echo "ERROR: No se pudo detectar la versión de JADX."
            exit 1
          fi

          JADX_VERSION="${JADX_TAG#v}"

          echo "Tag detectado: $JADX_TAG"
          echo "Versión: $JADX_VERSION"

          JADX_URL="https://github.com/skylot/jadx/releases/download/${JADX_TAG}/jadx-${JADX_VERSION}.zip"

          echo ""
          echo "Descargando JADX..."

          wget \
            --show-progress \
            -O "jadx-${JADX_VERSION}.zip" \
            "$JADX_URL"

          if [ ! -s "jadx-${JADX_VERSION}.zip" ]; then
            echo "ERROR: JADX no fue descargado correctamente."
            exit 1
          fi

          rm -rf jadx-tool

          unzip -q \
            "jadx-${JADX_VERSION}.zip" \
            -d jadx-tool

          chmod +x jadx-tool/bin/jadx

          export PATH="$GITHUB_WORKSPACE/jadx-tool/bin:$PATH"

          echo "$GITHUB_WORKSPACE/jadx-tool/bin" >> "$GITHUB_PATH"

          echo ""
          echo "JADX instalado en:"
          command -v jadx

          echo ""
          jadx --version


      # ==================================================
      # 4. DESCARGAR APK
      # ==================================================
      - name: 4. Descargar APK desde GitHub Releases
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "           DESCARGA DEL APK"
          echo "=========================================="

          mkdir -p input_apk
          mkdir -p output_project

          APK_URL="https://github.com/denarelys-lgtm/NexusAPK-Engine/releases/download/Apk/tu_app.apk"

          wget \
            --show-progress \
            -O input_apk/app.target.apk \
            "$APK_URL"

          if [ ! -s input_apk/app.target.apk ]; then
            echo "ERROR: APK no descargado."
            exit 1
          fi

          echo ""
          echo "APK descargado:"
          ls -lh input_apk/app.target.apk


      # ==================================================
      # 5. DESCOMPILAR APK
      # ==================================================
      - name: 5. Descompilar APK a Proyecto Gradle Java
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          DESCOMPILANDO APK"
          echo "=========================================="

          export PATH="$GITHUB_WORKSPACE/jadx-tool/bin:$PATH"

          TARGET_APK="input_apk/app.target.apk"

          echo ""
          echo "JADX:"
          command -v jadx
          jadx --version

          echo ""
          echo "APK:"
          ls -lh "$TARGET_APK"

          rm -rf output_project

          echo ""
          echo "Iniciando JADX..."
          echo ""

          set +e

          jadx \
            -d output_project \
            --export-gradle \
            --deobf \
            --show-bad-code \
            --threads-count 4 \
            "$TARGET_APK"

          JADX_EXIT_CODE=$?

          set -e

          echo ""
          echo "=========================================="
          echo "          RESULTADO DE JADX"
          echo "=========================================="

          echo "Código de salida: $JADX_EXIT_CODE"

          if [ ! -d "output_project" ]; then
            echo "ERROR: No se creó output_project."
            exit "$JADX_EXIT_CODE"
          fi

          FILE_COUNT=$(find output_project -type f | wc -l)

          echo "Archivos generados: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: output_project está vacío."
            exit 1
          fi

          if [ "$JADX_EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "AVISO: JADX terminó con errores."
            echo "El proyecto generado será procesado igualmente."
          else
            echo ""
            echo "JADX terminó correctamente."
          fi

          echo ""
          echo "Estructura principal:"

          if [ -f output_project/build.gradle ]; then
            echo "OK: output_project/build.gradle"
          else
            echo "AVISO: falta output_project/build.gradle"
          fi

          if [ -f output_project/app/build.gradle ]; then
            echo "OK: output_project/app/build.gradle"
          else
            echo "AVISO: falta output_project/app/build.gradle"
          fi

          if [ -f output_project/settings.gradle ]; then
            echo "OK: output_project/settings.gradle"
          fi

          if [ -f output_project/settings.gradle.kts ]; then
            echo "OK: output_project/settings.gradle.kts"
          fi


      # ==================================================
      # 6. INSPECCIONAR PROYECTO GRADLE
      # ==================================================
      - name: 6. Inspeccionar Proyecto Gradle Generado
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "       INSPECCIÓN DEL PROYECTO"
          echo "=========================================="

          echo ""
          echo "Archivos principales:"

          find output_project \
            -maxdepth 2 \
            -type f \
            -print \
            | sort \
            | sed -n '1,200p'

          echo ""
          echo "=========================================="
          echo "          build.gradle PRINCIPAL"
          echo "=========================================="

          if [ -f output_project/build.gradle ]; then
            sed -n '1,240p' output_project/build.gradle
          fi

          echo ""
          echo "=========================================="
          echo "          app/build.gradle"
          echo "=========================================="

          if [ -f output_project/app/build.gradle ]; then
            sed -n '1,300p' output_project/app/build.gradle
          fi

          echo ""
          echo "=========================================="
          echo "          settings.gradle"
          echo "=========================================="

          if [ -f output_project/settings.gradle ]; then
            sed -n '1,200p' output_project/settings.gradle
          fi

          echo ""
          echo "=========================================="
          echo "       GRADLE WRAPPER"
          echo "=========================================="

          if [ -f output_project/gradlew ]; then
            echo "gradlew: EXISTE"
            ls -lh output_project/gradlew
          else
            echo "gradlew: NO EXISTE"
          fi

          if [ -f output_project/gradle/wrapper/gradle-wrapper.properties ]; then
            echo ""
            echo "gradle-wrapper.properties:"
            cat output_project/gradle/wrapper/gradle-wrapper.properties
          fi


      # ==================================================
      # 7. SANEAMIENTO DEL CÓDIGO
      # ==================================================
      - name: 7. Saneamiento Inteligente del Código
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          POST-PROCESAMIENTO"
          echo "=========================================="

          if [ -f "scripts/post_process.py" ]; then

            echo "Ejecutando scripts/post_process.py..."

            python3 scripts/post_process.py

            echo ""
            echo "Post-procesamiento terminado."

          else

            echo "AVISO: scripts/post_process.py no existe."
            echo "Se continúa sin post-procesamiento."

          fi


      # ==================================================
      # 8. RECOMPILAR APK
      # ==================================================
      - name: 8. Recompilar el Proyecto a un Nuevo APK con Gradle
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          RECOMPILANDO APK"
          echo "=========================================="

          if [ ! -d "output_project" ]; then
            echo "ERROR: No existe output_project."
            exit 1
          fi

          cd output_project

          echo ""
          echo "Directorio actual:"
          pwd

          echo ""
          echo "Contenido:"
          ls -la

          echo ""

          if [ ! -f "gradlew" ]; then

            echo "=========================================="
            echo "     GRADLE WRAPPER NO ENCONTRADO"
            echo "=========================================="

            echo ""
            echo "JADX generó el proyecto, pero no existe:"
            echo "gradlew"

            echo ""
            echo "No se ejecutará Gradle todavía."

            echo ""
            echo "La inspección anterior mostrará qué"
            echo "estructura Gradle generó JADX."

            exit 1
          fi

          chmod +x gradlew

          echo ""
          echo "Gradle Wrapper encontrado."

          echo ""
          echo "Versión de Gradle:"

          ./gradlew --version

          echo ""
          echo "Compilando..."

          ./gradlew assembleDebug --stacktrace

          echo ""
          echo "Compilación terminada."

          echo ""
          echo "APKs encontrados:"

          find . \
            -type f \
            -name "*.apk" \
            -print


      # ==================================================
      # 9. SUBIR APK
      # ==================================================
      - name: 9. Subir el APK Recompilado como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-apk
          path: output_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      # ==================================================
      # 10. SINCRONIZAR CÓDIGO
      # ==================================================
      - name: 10. Sincronizar Código Fuente al Repositorio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "       SINCRONIZANDO CÓDIGO"
          echo "=========================================="

          git config \
            --global \
            user.name \
            "github-actions[bot]"

          git config \
            --global \
            user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add output_project/

          echo ""
          echo "Estado de Git:"
          git status

          if git diff-index --quiet HEAD; then

            echo ""
            echo "No hay cambios nuevos que commitear."

          else

            echo ""
            echo "Creando commit..."

            git commit \
              -m "feat: Update decompiled source code [Automated CI]"

            echo ""
            echo "Enviando cambios a main..."

            git push origin HEAD:main

          fi

          echo ""
          echo "Workflow terminado."
