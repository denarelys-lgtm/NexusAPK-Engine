name: NexusAPK Pipeline

on:
  push:
    paths:
      - 'input_apk/**'
      - '.github/workflows/decompiler.yml'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  process-apk:
    runs-on: ubuntu-latest

    steps:

      - name: 1. Checkout del Repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Instalar JADX
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          INSTALACION DE JADX"
          echo "=========================================="

          JADX_TAG=$(curl -fsSL \
            "https://api.github.com/repos/skylot/jadx/releases/latest" \
            | grep '"tag_name"' \
            | head -1 \
            | cut -d '"' -f 4)

          if [ -z "$JADX_TAG" ]; then
            echo "ERROR: No se pudo detectar la version de JADX."
            exit 1
          fi

          JADX_VERSION="${JADX_TAG#v}"

          echo "Tag detectado: $JADX_TAG"
          echo "Version: $JADX_VERSION"

          JADX_URL="https://github.com/skylot/jadx/releases/download/${JADX_TAG}/jadx-${JADX_VERSION}.zip"

          wget \
            --show-progress \
            -O "jadx-${JADX_VERSION}.zip" \
            "$JADX_URL"

          rm -rf jadx-tool

          unzip -q \
            "jadx-${JADX_VERSION}.zip" \
            -d jadx-tool

          chmod +x jadx-tool/bin/jadx

          echo "$GITHUB_WORKSPACE/jadx-tool/bin" >> "$GITHUB_PATH"

          export PATH="$GITHUB_WORKSPACE/jadx-tool/bin:$PATH"

          echo ""
          echo "JADX instalado:"
          command -v jadx
          jadx --version


      - name: 4. Descargar APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "             DESCARGA DEL APK"
          echo "=========================================="

          mkdir -p input_apk

          APK_URL="https://github.com/denarelys-lgtm/NexusAPK-Engine/releases/download/Apk/tu_app.apk"

          wget \
            --show-progress \
            -O input_apk/app.target.apk \
            "$APK_URL"

          if [ ! -s input_apk/app.target.apk ]; then
            echo "ERROR: El APK no fue descargado."
            exit 1
          fi

          echo ""
          echo "APK descargado:"
          ls -lh input_apk/app.target.apk


      - name: 5. Descompilar APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "           DESCOMPILANDO APK"
          echo "=========================================="

          export PATH="$GITHUB_WORKSPACE/jadx-tool/bin:$PATH"

          rm -rf output_project

          set +e

          jadx \
            -d output_project \
            --export-gradle \
            --deobf \
            --show-bad-code \
            --threads-count 4 \
            input_apk/app.target.apk

          JADX_EXIT=$?

          set -e

          echo ""
          echo "=========================================="
          echo "             RESULTADO JADX"
          echo "=========================================="

          echo "Codigo de salida: $JADX_EXIT"

          if [ ! -d output_project ]; then
            echo "ERROR: No existe output_project."
            exit 1
          fi

          FILE_COUNT=$(find output_project -type f | wc -l)

          echo "Archivos generados: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: output_project esta vacio."
            exit 1
          fi

          if [ "$JADX_EXIT" -ne 0 ]; then
            echo "AVISO: JADX termino con errores."
            echo "El proyecto generado se procesara igualmente."
          fi

          echo ""
          echo "Estructura principal:"

          if [ -f output_project/build.gradle ]; then
            echo "OK: output_project/build.gradle"
          else
            echo "AVISO: falta output_project/build.gradle"
          fi

          if [ -f output_project/app/build.gradle ]; then
            echo "OK: output_project/app/build.gradle"
          else
            echo "AVISO: falta output_project/app/build.gradle"
          fi

          if [ -f output_project/settings.gradle ]; then
            echo "OK: output_project/settings.gradle"
          else
            echo "AVISO: falta output_project/settings.gradle"
          fi


      - name: 6. Inspeccionar Proyecto
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "        INSPECCION DEL PROYECTO"
          echo "=========================================="

          echo ""
          echo "===== settings.gradle ====="

          if [ -f output_project/settings.gradle ]; then
            cat output_project/settings.gradle
          fi

          echo ""
          echo "===== build.gradle ====="

          if [ -f output_project/build.gradle ]; then
            cat output_project/build.gradle
          fi

          echo ""
          echo "===== app/build.gradle ====="

          if [ -f output_project/app/build.gradle ]; then
            cat output_project/app/build.gradle
          fi

          echo ""
          echo "===== gradle.properties ====="

          if [ -f output_project/gradle.properties ]; then
            cat output_project/gradle.properties
          else
            echo "No existe gradle.properties todavia."
          fi


      - name: 7. Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          INSTALANDO GRADLE 8.11.1"
          echo "=========================================="

          GRADLE_VERSION="8.11.1"

          wget \
            --show-progress \
            -O gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          rm -rf "$HOME/gradle"

          mkdir -p "$HOME/gradle"

          unzip -q \
            gradle.zip \
            -d "$HOME/gradle"

          export GRADLE_HOME="$HOME/gradle/gradle-${GRADLE_VERSION}"
          export PATH="$GRADLE_HOME/bin:$PATH"

          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"

          echo ""
          echo "Gradle instalado:"
          gradle --version


      - name: 8. Configurar Gradle y Wrapper
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "      CONFIGURANDO GRADLE Y MEMORIA"
          echo "=========================================="

          export GRADLE_HOME="$HOME/gradle/gradle-8.11.1"
          export PATH="$GRADLE_HOME/bin:$PATH"

          cd output_project

          echo ""
          echo "Creando gradle.properties..."

          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' \
            'org.gradle.workers.max=2' \
            'org.gradle.parallel=false' \
            'org.gradle.daemon=false' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            > gradle.properties

          echo ""
          echo "Contenido de gradle.properties:"
          cat gradle.properties

          echo ""
          echo "Generando Gradle Wrapper..."

          gradle wrapper \
            --gradle-version 8.11.1 \
            --distribution-type bin

          if [ ! -f gradlew ]; then
            echo "ERROR: No se pudo generar gradlew."
            exit 1
          fi

          chmod +x gradlew

          echo ""
          echo "Wrapper generado correctamente."

          ls -lh gradlew

          echo ""
          echo "Version del wrapper:"

          ./gradlew --version


      - name: 9. Saneamiento del Codigo
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          POST-PROCESAMIENTO"
          echo "=========================================="

          if [ -f scripts/post_process.py ]; then
            python3 scripts/post_process.py
          else
            echo "AVISO: scripts/post_process.py no existe."
          fi


      - name: 10. Reparar Recursos Android Generados por JADX
        shell: bash
        run: |
          set -u

          echo "=========================================="
          echo "     REPARACION AUTOMATICA DE RECURSOS"
          echo "=========================================="

          RES_DIR="output_project/app/src/main/res"

          if [ ! -d "$RES_DIR" ]; then
            echo "AVISO: No existe $RES_DIR"
            exit 0
          fi

          echo ""
          echo "Directorio de recursos:"
          echo "$RES_DIR"

          rm -rf repair-backup
          mkdir -p repair-backup

          echo ""
          echo "=========================================="
          echo "1. INSPECCIONANDO XML"
          echo "=========================================="

          XML_COUNT=0
          XML_FIXED=0

          while IFS= read -r -d '' FILE; do

            XML_COUNT=$((XML_COUNT + 1))

            if grep -qF ']]>' "$FILE"; then

              echo ""
              echo "XML problematico:"
              echo "$FILE"

              BACKUP_DIR="repair-backup/$(dirname "$FILE")"

              mkdir -p "$BACKUP_DIR"
              cp "$FILE" "repair-backup/$FILE"

              python3 - "$FILE" <<'PY'
import sys
from pathlib import Path

file = Path(sys.argv[1])

try:
    data = file.read_text(encoding="utf-8")
except UnicodeDecodeError:
    data = file.read_text(
        encoding="utf-8",
        errors="replace"
    )

data = data.replace("]]>", "]]&gt;")

file.write_text(
    data,
    encoding="utf-8"
)
PY

              XML_FIXED=$((XML_FIXED + 1))

              echo "  -> Secuencia ]]> corregida."

            fi

          done < <(
            find "$RES_DIR" \
              -type f \
              -name "*.xml" \
              -print0
          )

          echo ""
          echo "XML inspeccionados: $XML_COUNT"
          echo "XML reparados: $XML_FIXED"


          echo ""
          echo "=========================================="
          echo "2. REVISANDO integers.xml"
          echo "=========================================="

          INTEGER_FILES=$(find "$RES_DIR" \
            -type f \
            -path "*/values*/integers.xml" \
            -print)

          if [ -z "$INTEGER_FILES" ]; then

            echo "No se encontraron integers.xml."

          else

            while IFS= read -r FILE; do

              echo ""
              echo "Revisando:"
              echo "$FILE"

              if [ ! -f "$FILE" ]; then
                continue
              fi

              BACKUP_DIR="repair-backup/$(dirname "$FILE")"

              mkdir -p "$BACKUP_DIR"
              cp "$FILE" "repair-backup/$FILE"

              python3 - "$FILE" <<'PY'
import sys
import re
from pathlib import Path

file = Path(sys.argv[1])

try:
    text = file.read_text(
        encoding="utf-8"
    )
except Exception:
    text = file.read_text(
        encoding="utf-8",
        errors="replace"
    )

original = text

text = text.replace(
    "]]>",
    "]]&gt;"
)

pattern = re.compile(
    r'(<integer\b[^>]*>)(.*?)(</integer>)',
    re.DOTALL
)

changes = 0

def repair_integer(match):

    global changes

    opening = match.group(1)
    value = match.group(2).strip()
    closing = match.group(3)

    if re.fullmatch(
        r'-?(0|[1-9][0-9]*)',
        value
    ):
        return opening + value + closing

    if re.fullmatch(
        r'-?0[xX][0-9a-fA-F]+',
        value
    ):
        return opening + value + closing

    cleaned = (
        value
        .replace("\n", " ")
        .replace("\r", " ")
        .strip()
    )

    if re.fullmatch(
        r'-?(0|[1-9][0-9]*)',
        cleaned
    ):
        changes += 1

        print(
            f"  Reparando integer: "
            f"{value!r} -> {cleaned!r}"
        )

        return opening + cleaned + closing

    if re.fullmatch(
        r'-?0[xX][0-9a-fA-F]+',
        cleaned
    ):
        changes += 1

        print(
            f"  Reparando integer: "
            f"{value!r} -> {cleaned!r}"
        )

        return opening + cleaned + closing

    changes += 1

    print(
        f"  AVISO: integer invalido: "
        f"{value!r}"
    )

    print(
        "  Sustituyendo por 0."
    )

    return opening + "0" + closing


text = pattern.sub(
    repair_integer,
    text
)

if text != original:

    file.write_text(
        text,
        encoding="utf-8"
    )

print(
    f"  Cambios realizados: {changes}"
)
PY

            done <<< "$INTEGER_FILES"

          fi


          echo ""
          echo "=========================================="
          echo "3. INSPECCIONANDO PNG 9-PATCH"
          echo "=========================================="

          PNG_COUNT=0
          PNG_BAD=0

          while IFS= read -r -d '' FILE; do

            PNG_COUNT=$((PNG_COUNT + 1))

            if command -v file >/dev/null 2>&1; then

              INFO=$(file "$FILE" 2>/dev/null || true)

              if echo "$INFO" | grep -qi "PNG"; then

                echo "OK PNG: $FILE"

              else

                echo ""
                echo "AVISO PNG sospechoso:"
                echo "$FILE"
                echo "$INFO"

                PNG_BAD=$((PNG_BAD + 1))

              fi

            fi

          done < <(
            find "$RES_DIR" \
              -type f \
              -name "*.9.png" \
              -print0
          )

          echo ""
          echo "9-Patch encontrados: $PNG_COUNT"
          echo "9-Patch sospechosos: $PNG_BAD"


          echo ""
          echo "=========================================="
          echo "4. VALIDACION XML"
          echo "=========================================="

          INVALID_XML=0

          while IFS= read -r -d '' FILE; do

            if ! python3 - "$FILE" <<'PY'
import sys
import xml.etree.ElementTree as ET

try:
    ET.parse(sys.argv[1])
except Exception:
    sys.exit(1)
PY
            then

              echo "XML invalido:"
              echo "$FILE"

              INVALID_XML=$((INVALID_XML + 1))

            fi

          done < <(
            find "$RES_DIR" \
              -type f \
              -name "*.xml" \
              -print0
          )

          echo ""
          echo "XML invalidos restantes: $INVALID_XML"


          echo ""
          echo "=========================================="
          echo "5. RESUMEN"
          echo "=========================================="

          echo "XML inspeccionados: $XML_COUNT"
          echo "XML reparados: $XML_FIXED"
          echo "9-Patch encontrados: $PNG_COUNT"
          echo "9-Patch sospechosos: $PNG_BAD"
          echo "XML invalidos restantes: $INVALID_XML"

          echo ""
          echo "Backup de archivos modificados:"

          find repair-backup \
            -type f \
            2>/dev/null \
            | head -50 || true

          echo ""
          echo "=========================================="
          echo "RECURSOS LISTOS PARA AAPT2"
          echo "=========================================="


      - name: 11. Recompilar APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "            RECOMPILANDO APK"
          echo "=========================================="

          if [ ! -d output_project ]; then
            echo "ERROR: No existe output_project."
            exit 1
          fi

          cd output_project

          if [ ! -f gradlew ]; then
            echo "ERROR: No existe gradlew."
            exit 1
          fi

          chmod +x gradlew

          echo ""
          echo "Configuracion de Gradle:"
          cat gradle.properties

          echo ""
          echo "Version de Gradle:"
          ./gradlew --version

          echo ""
          echo "Iniciando compilacion..."

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --max-workers=2 \
            --stacktrace

          echo ""
          echo "=========================================="
          echo "        COMPILACION TERMINADA"
          echo "=========================================="

          echo ""
          echo "APKs encontrados:"

          find . \
            -type f \
            -name "*.apk" \
            -print


      - name: 12. Verificar APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "           VERIFICANDO APK"
          echo "=========================================="

          APK_PATH="output_project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: No se encontro:"
            echo "$APK_PATH"
            exit 1
          fi

          echo ""
          echo "APK generado correctamente:"
          ls -lh "$APK_PATH"

          echo ""
          echo "Tamano:"
          du -h "$APK_PATH"


      - name: 13. Subir APK Recompilado
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-apk
          path: output_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      - name: 14. Sincronizar Codigo Fuente
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "        SINCRONIZANDO CODIGO"
          echo "=========================================="

          git config \
            --global \
            user.name \
            "github-actions[bot]"

          git config \
            --global \
            user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add output_project/

          echo ""
          echo "Estado de Git:"

          git status

          if git diff-index --quiet HEAD; then

            echo "No hay cambios nuevos que commitear."

          else

            git commit \
              -m "feat: Update decompiled source code [Automated CI]"

            git push origin HEAD:main

          fi

          echo ""
          echo "=========================================="
          echo "          WORKFLOW TERMINADO"
          echo "=========================================="
