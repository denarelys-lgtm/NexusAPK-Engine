name: NexusAPK Pipeline

on:
  push:
    paths:
      - 'input_apk/**'
      - '.github/workflows/decompiler.yml'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  process-apk:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================
      - name: 1. Checkout del Repositorio
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 17
      # ==================================================
      - name: 2. Configurar Entorno Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==================================================
      # 3. INSTALAR JADX
      # ==================================================
      - name: 3. Instalar JADX CLI Moderno
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          INSTALACIÓN DE JADX"
          echo "=========================================="

          echo "Detectando última versión de JADX..."

          JADX_TAG=$(curl -fsSL \
            "https://api.github.com/repos/skylot/jadx/releases/latest" \
            | grep '"tag_name"' \
            | head -1 \
            | cut -d '"' -f 4)

          if [ -z "$JADX_TAG" ]; then
            echo "ERROR: No se pudo detectar la versión de JADX."
            exit 1
          fi

          JADX_VERSION="${JADX_TAG#v}"

          echo "Tag detectado: $JADX_TAG"
          echo "Versión: $JADX_VERSION"

          JADX_URL="https://github.com/skylot/jadx/releases/download/${JADX_TAG}/jadx-${JADX_VERSION}.zip"

          echo ""
          echo "URL de descarga:"
          echo "$JADX_URL"

          echo ""
          echo "Descargando JADX..."

          wget \
            --show-progress \
            -O "jadx-${JADX_VERSION}.zip" \
            "$JADX_URL"

          if [ ! -s "jadx-${JADX_VERSION}.zip" ]; then
            echo "ERROR: El archivo JADX no existe o está vacío."
            exit 1
          fi

          echo ""
          echo "Extrayendo JADX..."

          rm -rf jadx-tool

          unzip -q \
            "jadx-${JADX_VERSION}.zip" \
            -d jadx-tool

          echo ""
          echo "Contenido de jadx-tool/bin:"
          ls -la jadx-tool/bin

          chmod +x jadx-tool/bin/jadx

          # PATH para este mismo paso
          export PATH="$GITHUB_WORKSPACE/jadx-tool/bin:$PATH"

          # PATH para los siguientes pasos
          echo "$GITHUB_WORKSPACE/jadx-tool/bin" >> "$GITHUB_PATH"

          echo ""
          echo "Verificando JADX..."

          if ! command -v jadx >/dev/null 2>&1; then
            echo "ERROR: jadx no está disponible en PATH."
            exit 1
          fi

          echo "JADX encontrado en:"
          command -v jadx

          echo ""
          echo "Versión:"
          jadx --version

          echo ""
          echo "JADX instalado correctamente."


      # ==================================================
      # 4. DESCARGAR APK
      # ==================================================
      - name: 4. Descargar APK desde GitHub Releases
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "           DESCARGA DEL APK"
          echo "=========================================="

          mkdir -p input_apk
          mkdir -p output_project

          APK_URL="https://github.com/denarelys-lgtm/NexusAPK-Engine/releases/download/Apk/tu_app.apk"

          echo "URL del APK:"
          echo "$APK_URL"

          wget \
            --show-progress \
            -O input_apk/app.target.apk \
            "$APK_URL"

          if [ ! -s input_apk/app.target.apk ]; then
            echo "ERROR: No se pudo descargar el APK."
            exit 1
          fi

          echo ""
          echo "APK descargado correctamente."

          ls -lh input_apk/app.target.apk


      # ==================================================
      # 5. DESCOMPILAR APK CON JADX
      # ==================================================
      - name: 5. Descompilar APK a Proyecto Gradle Java
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          DESCOMPILANDO APK"
          echo "=========================================="

          export PATH="$GITHUB_WORKSPACE/jadx-tool/bin:$PATH"

          TARGET_APK="input_apk/app.target.apk"

          echo ""
          echo "JADX:"
          command -v jadx
          jadx --version

          echo ""
          echo "APK objetivo:"
          ls -lh "$TARGET_APK"

          echo ""
          echo "Eliminando salida anterior..."

          rm -rf output_project

          echo ""
          echo "Iniciando descompilación..."
          echo ""

          # JADX puede devolver código != 0 cuando encuentra
          # clases que no puede reconstruir completamente.
          # No detenemos el workflow inmediatamente.

          set +e

          jadx \
            -d output_project \
            --export-gradle \
            --deobf \
            --show-bad-code \
            --threads-count 4 \
            "$TARGET_APK"

          JADX_EXIT_CODE=$?

          set -e

          echo ""
          echo "=========================================="
          echo "          RESULTADO DE JADX"
          echo "=========================================="

          echo "Código de salida: $JADX_EXIT_CODE"

          if [ -d "output_project" ]; then
            echo "output_project: EXISTE"
          else
            echo "output_project: NO EXISTE"
          fi

          echo ""

          if [ -d "output_project" ]; then

            FILE_COUNT=$(find output_project -type f | wc -l)

            echo "Archivos generados: $FILE_COUNT"

            echo ""
            echo "Primeros archivos generados:"
            find output_project -type f | head -100

          else

            FILE_COUNT=0

          fi

          echo ""

          # ------------------------------------------------
          # Analizar resultado
          # ------------------------------------------------

          if [ "$JADX_EXIT_CODE" -ne 0 ]; then

            echo "AVISO: JADX terminó con errores."

            if [ "$FILE_COUNT" -gt 0 ]; then

              echo ""
              echo "JADX generó un proyecto parcial."
              echo "Se continuará con el workflow."

            else

              echo ""
              echo "ERROR: JADX no generó ningún archivo."
              exit "$JADX_EXIT_CODE"

            fi

          else

            echo "JADX terminó correctamente."

          fi

          echo ""
          echo "Descompilación finalizada."


      # ==================================================
      # 6. SANEAMIENTO DEL CÓDIGO
      # ==================================================
      - name: 6. Saneamiento Inteligente del Código
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "        POST-PROCESAMIENTO"
          echo "=========================================="

          if [ -f "scripts/post_process.py" ]; then

            echo "Encontrado:"
            echo "scripts/post_process.py"

            echo ""
            echo "Ejecutando..."

            python3 scripts/post_process.py

            echo ""
            echo "Post-procesamiento terminado."

          else

            echo "AVISO:"
            echo "No existe scripts/post_process.py"
            echo "Se continuará sin post-procesamiento."

          fi


      # ==================================================
      # 7. RECOMPILAR APK
      # ==================================================
      - name: 7. Recompilar el Proyecto a un Nuevo APK con Gradle
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          RECOMPILANDO APK"
          echo "=========================================="

          if [ ! -d "output_project" ]; then
            echo "ERROR: No existe output_project."
            exit 1
          fi

          cd output_project

          echo ""
          echo "Directorio:"
          pwd

          echo ""
          echo "Contenido:"
          ls -la

          echo ""

          if [ ! -f "gradlew" ]; then

            echo "=========================================="
            echo "ERROR: NO SE ENCONTRÓ GRADLE WRAPPER"
            echo "=========================================="

            echo ""
            echo "JADX generó archivos, pero no generó"
            echo "un proyecto Gradle completo con gradlew."

            echo ""
            echo "Estructura encontrada:"

            find . -maxdepth 3 -type f | head -200

            echo ""
            echo "El workflow se detiene aquí porque no"
            echo "es posible ejecutar ./gradlew."

            exit 1

          fi

          chmod +x gradlew

          echo ""
          echo "Gradle Wrapper encontrado."

          echo ""
          echo "Versión de Gradle:"

          ./gradlew --version

          echo ""
          echo "Iniciando compilación..."

          ./gradlew assembleDebug --stacktrace

          echo ""
          echo "Compilación terminada."

          echo ""
          echo "Buscando APK generado..."

          find . \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print


      # ==================================================
      # 8. SUBIR APK RECOMPILADO
      # ==================================================
      - name: 8. Subir el APK Recompilado como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-apk
          path: output_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      # ==================================================
      # 9. SINCRONIZAR CÓDIGO FUENTE
      # ==================================================
      - name: 9. Sincronizar Código Fuente al Repositorio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "       SINCRONIZANDO CÓDIGO"
          echo "=========================================="

          git config \
            --global \
            user.name \
            "github-actions[bot]"

          git config \
            --global \
            user.email \
            "github-actions[bot]@users.noreply.github.com"

          echo ""
          echo "Agregando output_project..."

          git add output_project/

          echo ""
          echo "Estado de Git:"
          git status

          if git diff-index --quiet HEAD; then

            echo ""
            echo "No hay cambios nuevos que commitear."

          else

            echo ""
            echo "Creando commit..."

            git commit \
              -m "feat: Update decompiled source code [Automated CI]"

            echo ""
            echo "Enviando cambios a main..."

            git push origin HEAD:main

          fi

          echo ""
          echo "Proceso terminado."
