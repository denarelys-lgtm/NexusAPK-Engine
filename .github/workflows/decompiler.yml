name: NexusAPK Pipeline

on:
  push:
    paths:
      - 'input_apk/**'
      - '.github/workflows/decompiler.yml'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  process-apk:
    runs-on: ubuntu-latest

    steps:

      - name: 1. Checkout del Repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Instalar JADX
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          INSTALACION DE JADX"
          echo "=========================================="

          API_URL="https://api.github.com/repos/skylot/jadx/releases/latest"

          JADX_TAG=$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['tag_name'])")

          JADX_VERSION="${JADX_TAG#v}"
          JADX_URL="https://github.com/skylot/jadx/releases/download/${JADX_TAG}/jadx-${JADX_VERSION}.zip"

          echo "JADX version: $JADX_VERSION"

          wget --show-progress -O "jadx-${JADX_VERSION}.zip" "$JADX_URL"

          rm -rf jadx-tool
          unzip -q "jadx-${JADX_VERSION}.zip" -d jadx-tool
          chmod +x jadx-tool/bin/jadx

          echo "$GITHUB_WORKSPACE/jadx-tool/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/jadx-tool/bin:$PATH"

          jadx --version

      - name: 4. Instalar apktool
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "         INSTALACION DE APKTOOL"
          echo "=========================================="

          API_URL="https://api.github.com/repos/iBotPeaches/Apktool/releases/latest"

          APKTOOL_TAG=$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['tag_name'])")

          APKTOOL_VERSION="${APKTOOL_TAG#v}"
          APKTOOL_URL="https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"

          echo "apktool version: $APKTOOL_VERSION"
          echo "URL: $APKTOOL_URL"

          wget --show-progress -O apktool.jar "$APKTOOL_URL"

          java -jar apktool.jar --version

      - name: 5. Descargar APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "             DESCARGA DEL APK"
          echo "=========================================="

          mkdir -p input_apk

          APK_URL="https://github.com/denarelys-lgtm/NexusAPK-Engine/releases/download/Apk/tu_app.apk"

          wget --show-progress -O input_apk/app.target.apk "$APK_URL"

          if [ ! -s input_apk/app.target.apk ]; then
            echo "ERROR: El APK no fue descargado."
            exit 1
          fi

          ls -lh input_apk/app.target.apk
          file input_apk/app.target.apk

      - name: 6. Descompilar con JADX (codigo fuente)
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "        DESCOMPILANDO CON JADX"
          echo "=========================================="

          export PATH="$GITHUB_WORKSPACE/jadx-tool/bin:$PATH"

          rm -rf output_project

          set +e
          jadx \
            -d output_project \
            --export-gradle \
            --deobf \
            --show-bad-code \
            --threads-count 4 \
            input_apk/app.target.apk
          JADX_EXIT=$?
          set -e

          echo "JADX exit: $JADX_EXIT"

          if [ ! -d output_project ]; then
            echo "ERROR: No existe output_project."
            exit 1
          fi

          echo "Archivos generados: $(find output_project -type f | wc -l)"

      - name: 7. Saneamiento del Codigo (scripts/post_process.py)
        shell: bash
        run: |
          set -e

          if [ -f scripts/post_process.py ]; then
            python3 scripts/post_process.py
          else
            echo "AVISO: scripts/post_process.py no existe."
          fi

      - name: 8. Descompilar con apktool (para rebuild)
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "      DESCOMPILANDO CON APKTOOL"
          echo "=========================================="

          rm -rf output_apktool

          set +e
          java -jar apktool.jar d \
            -f \
            -o output_apktool \
            input_apk/app.target.apk
          APKTOOL_D_EXIT=$?
          set -e

          echo "apktool decode exit: $APKTOOL_D_EXIT"

          if [ ! -d output_apktool ]; then
            echo "ERROR: apktool no genero output_apktool."
            exit 1
          fi

          echo ""
          echo "Estructura generada:"
          ls -la output_apktool/

          echo ""
          echo "apktool.yml:"
          cat output_apktool/apktool.yml

      - name: 9. Recompilar con apktool
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "        RECOMPILANDO CON APKTOOL"
          echo "=========================================="

          rm -f rebuilt.apk

          set +e
          java -jar apktool.jar b \
            output_apktool \
            -o rebuilt.apk
          APKTOOL_B_EXIT=$?
          set -e

          echo "apktool build exit: $APKTOOL_B_EXIT"

          if [ ! -f rebuilt.apk ]; then
            echo "ERROR: rebuilt.apk no fue generado."
            exit 1
          fi

          ls -lh rebuilt.apk

      - name: 10. Verificar APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "           VERIFICANDO APK"
          echo "=========================================="

          ls -lh rebuilt.apk
          file rebuilt.apk

          echo ""
          echo "Entradas del APK:"
          unzip -l rebuilt.apk | head -20

      - name: 11. Subir APK Recompilado
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-apk
          path: rebuilt.apk
          if-no-files-found: error

      - name: 12. Subir Codigo Descompilado (JADX)
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-source
          path: output_project/
          if-no-files-found: error

      - name: 13. Sincronizar Codigo Fuente
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "        SINCRONIZANDO CODIGO"
          echo "=========================================="

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add output_project/

          git status

          if git diff-index --quiet HEAD; then
            echo "No hay cambios nuevos que commitear."
          else
            git commit -m "feat: Update decompiled source code [Automated CI]"
            git push origin HEAD:main
          fi

          echo ""
          echo "=========================================="
          echo "          WORKFLOW TERMINADO"
          echo "=========================================="
