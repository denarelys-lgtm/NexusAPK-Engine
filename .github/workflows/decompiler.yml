name: NexusAPK Pipeline

on:
  push:
    paths:
      - 'input_apk/**'
      - '.github/workflows/decompiler.yml'
      - 'scripts/**'
      - 'templates/**'
  workflow_dispatch:

jobs:
  process-apk:
    runs-on: ubuntu-latest

    steps:

      - name: 1. Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Instalar JADX
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          INSTALACION DE JADX"
          echo "=========================================="

          API_URL="https://api.github.com/repos/skylot/jadx/releases/latest"

          JADX_TAG=$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['tag_name'])")

          if [ -z "$JADX_TAG" ]; then
            echo "ERROR: No se pudo detectar la version de JADX."
            exit 1
          fi

          JADX_VERSION="${JADX_TAG#v}"
          JADX_URL="https://github.com/skylot/jadx/releases/download/${JADX_TAG}/jadx-${JADX_VERSION}.zip"

          echo "Tag detectado: $JADX_TAG"
          echo "Version: $JADX_VERSION"
          echo "URL: $JADX_URL"

          wget --show-progress -O "jadx-${JADX_VERSION}.zip" "$JADX_URL"

          rm -rf jadx-tool
          unzip -q "jadx-${JADX_VERSION}.zip" -d jadx-tool
          chmod +x jadx-tool/bin/jadx

          echo "$GITHUB_WORKSPACE/jadx-tool/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/jadx-tool/bin:$PATH"

          echo ""
          echo "JADX instalado:"
          command -v jadx
          jadx --version

      - name: 4. Instalar apktool
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "         INSTALACION DE APKTOOL"
          echo "=========================================="

          API_URL="https://api.github.com/repos/iBotPeaches/Apktool/releases/latest"

          APKTOOL_TAG=$(curl -fsSL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL" \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['tag_name'])")

          if [ -z "$APKTOOL_TAG" ]; then
            echo "ERROR: No se pudo detectar la version de apktool."
            exit 1
          fi

          APKTOOL_VERSION="${APKTOOL_TAG#v}"
          APKTOOL_URL="https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"

          echo "Tag detectado: $APKTOOL_TAG"
          echo "Version: $APKTOOL_VERSION"
          echo "URL: $APKTOOL_URL"

          wget --show-progress -O apktool.jar "$APKTOOL_URL"

          echo ""
          echo "apktool instalado:"
          java -jar apktool.jar --version

      - name: 5. Descargar APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "             DESCARGA DEL APK"
          echo "=========================================="

          mkdir -p input_apk

          APK_URL="https://github.com/denarelys-lgtm/NexusAPK-Engine/releases/download/Apk/tu_app.apk"

          wget --show-progress -O input_apk/app.target.apk "$APK_URL"

          if [ ! -s input_apk/app.target.apk ]; then
            echo "ERROR: El APK no fue descargado."
            exit 1
          fi

          echo ""
          echo "APK descargado:"
          ls -lh input_apk/app.target.apk
          file input_apk/app.target.apk

      - name: 6. Descompilar con JADX (codigo fuente)
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "        DESCOMPILANDO CON JADX"
          echo "=========================================="

          export PATH="$GITHUB_WORKSPACE/jadx-tool/bin:$PATH"

          rm -rf output_project

          set +e
          jadx \
            -d output_project \
            --export-gradle \
            --deobf \
            --show-bad-code \
            --threads-count 4 \
            input_apk/app.target.apk
          JADX_EXIT=$?
          set -e

          echo ""
          echo "JADX exit code: $JADX_EXIT"

          if [ ! -d output_project ]; then
            echo "ERROR: No existe output_project."
            exit 1
          fi

          FILE_COUNT=$(find output_project -type f | wc -l)
          echo "Archivos generados: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: output_project esta vacio."
            exit 1
          fi

          if [ "$JADX_EXIT" -ne 0 ]; then
            echo "AVISO: JADX termino con errores parciales."
            echo "El codigo generado se procesara igualmente."
          fi

      - name: 7. Saneamiento del Codigo (scripts/post_process.py)
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          POST-PROCESAMIENTO"
          echo "=========================================="

          if [ -f scripts/post_process.py ]; then
            python3 scripts/post_process.py
          else
            echo "AVISO: scripts/post_process.py no existe."
          fi

      - name: 8. Descompilar con apktool (para rebuild)
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "      DESCOMPILANDO CON APKTOOL"
          echo "=========================================="

          rm -rf output_apktool

          set +e
          java -jar apktool.jar d \
            -f \
            -o output_apktool \
            input_apk/app.target.apk
          APKTOOL_D_EXIT=$?
          set -e

          echo "apktool decode exit: $APKTOOL_D_EXIT"

          if [ ! -d output_apktool ]; then
            echo "ERROR: apktool no genero output_apktool."
            exit 1
          fi

          echo ""
          echo "Estructura generada:"
          ls -la output_apktool/

          echo ""
          echo "apktool.yml:"
          cat output_apktool/apktool.yml

      - name: 9. Recompilar con apktool
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "        RECOMPILANDO CON APKTOOL"
          echo "=========================================="

          rm -f rebuilt-unsigned.apk

          set +e
          java -jar apktool.jar b \
            output_apktool \
            -o rebuilt-unsigned.apk
          APKTOOL_B_EXIT=$?
          set -e

          echo "apktool build exit: $APKTOOL_B_EXIT"

          if [ ! -f rebuilt-unsigned.apk ]; then
            echo "ERROR: rebuilt-unsigned.apk no fue generado."
            exit 1
          fi

          echo ""
          echo "APK sin firmar generado:"
          ls -lh rebuilt-unsigned.apk

      - name: 10. Zipalign del APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "              ZIPALIGN"
          echo "=========================================="

          BT_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)

          if [ -z "$BT_DIR" ]; then
            echo "No se encontro build-tools. Instalando..."
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" > /dev/null 2>&1 || true
            BT_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          fi

          echo "Build-tools encontrados en: $BT_DIR"
          export PATH="$BT_DIR:$PATH"

          echo "zipalign: $(command -v zipalign || echo 'no encontrado')"

          if ! command -v zipalign &> /dev/null; then
            echo "ERROR: zipalign no disponible."
            exit 1
          fi

          rm -f rebuilt-aligned.apk

          zipalign -p -f 4 rebuilt-unsigned.apk rebuilt-aligned.apk

          echo ""
          echo "APK alineado correctamente:"
          ls -lh rebuilt-aligned.apk

      - name: 11. Firmar APK (apksigner v1+v2+v3)
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "           FIRMANDO APK"
          echo "=========================================="

          BT_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          export PATH="$BT_DIR:$PATH"

          echo "apksigner: $(command -v apksigner || echo 'no encontrado')"

          if ! command -v apksigner &> /dev/null; then
            echo "ERROR: apksigner no disponible."
            exit 1
          fi

          KEYSTORE="debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            echo "Generando keystore de debug..."
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          rm -f rebuilt.apk

          apksigner sign \
            --ks "$KEYSTORE" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out rebuilt.apk \
            rebuilt-aligned.apk

          echo ""
          echo "Verificando firma..."
          apksigner verify --verbose rebuilt.apk

          echo ""
          echo "APK firmado:"
          ls -lh rebuilt.apk
          file rebuilt.apk

      - name: 12. Verificar APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "           VERIFICANDO APK"
          echo "=========================================="

          ls -lh rebuilt.apk
          file rebuilt.apk

          echo ""
          echo "Entradas del APK (primeras 20):"
          unzip -l rebuilt.apk | head -20

      - name: 13. Subir APK Recompilado
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-apk
          path: rebuilt.apk
          if-no-files-found: error

      - name: 14. Subir Codigo Descompilado (JADX)
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-source
          path: output_project/
          if-no-files-found: error

      # ==================================================
      # 14.0  DESCARGAR GRADLE WRAPPER
      # ==================================================

      - name: 14.0. Descargar Gradle wrapper 8.13
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "     DESCARGANDO GRADLE WRAPPER"
          echo "=========================================="

          mkdir -p templates/gradle/wrapper

          curl -fsSL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradle/wrapper/gradle-wrapper.jar" \
            -o templates/gradle/wrapper/gradle-wrapper.jar

          test -s templates/gradle/wrapper/gradle-wrapper.jar

          cat > templates/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -fsSL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradlew" \
            -o templates/gradlew

          curl -fsSL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradlew.bat" \
            -o templates/gradlew.bat

          chmod +x templates/gradlew

          echo ""
          echo "Wrapper descargado:"
          ls -la templates/
          ls -la templates/gradle/wrapper/

      # ==================================================
      # 14.5  GENERAR rebuild1.zip
      # ==================================================

      - name: 14.5. Generar rebuild1.zip
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "   EMPAQUETANDO PROYECTO COMPILABLE"
          echo "=========================================="

          python3 scripts/prepare_buildable_project.py

          echo ""
          echo "Contenido del ZIP (primeros 60):"
          unzip -l rebuild1.zip | head -60

          echo ""
          echo "Tamano:"
          ls -lh rebuild1.zip

      # ==================================================
      # 14.6  SUBIR rebuild1.zip COMO ARTIFACT
      # ==================================================

      - name: 14.6. Subir rebuild1.zip como artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebuild1-project
          path: rebuild1.zip
          if-no-files-found: error
          retention-days: 30

      # ==================================================
      # 14.7  PUBLICAR EN RELEASE
      # ==================================================

      - name: 14.7. Publicar rebuild1.zip en Release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "=========================================="
          echo "    PUBLICANDO EN RELEASE build1"
          echo "=========================================="

          TAG="build1"

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Build $TAG" \
              --notes "Proyecto compilable generado automaticamente." \
              --target "${{ github.sha }}"

          gh release upload "$TAG" rebuild1.zip --clobber

          echo "OK: rebuild1.zip publicado en release '$TAG'."

      - name: 15. Sincronizar Codigo Fuente (rama snapshot)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "   SINCRONIZANDO CODIGO (SNAPSHOT)"
          echo "=========================================="

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -f -q output_project/

          CHANGES=$(git diff --cached --numstat | wc -l)
          echo "Archivos en stage: $CHANGES"

          if [ "$CHANGES" -eq 0 ]; then
            echo ""
            echo "No hay cambios nuevos que sincronizar."
            echo ""
            echo "=========================================="
            echo "          WORKFLOW TERMINADO"
            echo "=========================================="
            exit 0
          fi

          echo ""
          echo "Guardando el nuevo volcado en un arbol temporal..."

          TREE_HASH=$(git write-tree)
          echo "Arbol: $TREE_HASH"

          echo ""
          echo "Creando commit huerfano (sin padre) para evitar acumulacion..."

          COMMIT_HASH=$(git commit-tree "$TREE_HASH" \
            -m "Decompiled source snapshot [skip ci]")

          echo "Commit: $COMMIT_HASH"

          echo ""
          echo "Actualizando rama decompiled-source (force push)..."

          git push origin "${COMMIT_HASH}:refs/heads/decompiled-source" --force

          echo ""
          echo "Rama decompiled-source actualizada con 1 solo commit."
          echo ""
          echo "=========================================="
          echo "          WORKFLOW TERMINADO"
          echo "=========================================="
