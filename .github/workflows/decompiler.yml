name: NexusAPK Pipeline

on:
  push:
    paths:
      - 'input_apk/**'
  workflow_dispatch:

jobs:
  process-apk:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: 1. Checkout del Repositorio
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: 2. Configurar Entorno Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Instalar JADX
      # --------------------------------------------------
      - name: 3. Instalar JADX CLI Moderno
        run: |
          set -e

          echo "Detectando última versión de JADX..."

          JADX_TAG=$(curl -fsSL https://api.github.com/repos/skylot/jadx/releases/latest \
            | grep '"tag_name"' \
            | head -1 \
            | cut -d '"' -f 4)

          if [ -z "$JADX_TAG" ]; then
            echo "ERROR: No se pudo detectar la versión de JADX."
            exit 1
          fi

          JADX_VERSION="${JADX_TAG#v}"

          echo "Tag detectado: $JADX_TAG"
          echo "Versión de JADX: $JADX_VERSION"

          JADX_URL="https://github.com/skylot/jadx/releases/download/${JADX_TAG}/jadx-${JADX_VERSION}.zip"

          echo "URL de descarga:"
          echo "$JADX_URL"

          wget -O "jadx-${JADX_VERSION}.zip" "$JADX_URL"

          echo "Extrayendo JADX..."

          unzip -q "jadx-${JADX_VERSION}.zip" -d jadx-tool

          chmod +x jadx-tool/bin/jadx

          echo "$GITHUB_WORKSPACE/jadx-tool/bin" >> "$GITHUB_PATH"

          echo "Verificando instalación..."

          jadx --version

      # --------------------------------------------------
      # 4. Descargar APK
      # --------------------------------------------------
      - name: 4. Descargar APK desde GitHub Releases
        run: |
          set -e

          mkdir -p input_apk
          mkdir -p output_project

          echo "Descargando APK desde GitHub Releases..."

          wget -O input_apk/app.target.apk \
            "https://github.com/denarelys-lgtm/NexusAPK-Engine/releases/download/Apk/tu_app.apk"

          echo "Verificando APK..."

          if [ ! -s input_apk/app.target.apk ]; then
            echo "ERROR: El APK no fue descargado correctamente."
            exit 1
          fi

          ls -lh input_apk/app.target.apk

      # --------------------------------------------------
      # 5. Descompilar APK con JADX
      # --------------------------------------------------
      - name: 5. Descompilar APK a Proyecto Gradle Java
        run: |
          set -e

          TARGET_APK="input_apk/app.target.apk"

          echo "APK objetivo:"
          echo "$TARGET_APK"

          echo "Versión de JADX:"
          jadx --version

          echo "Iniciando descompilación..."

          jadx \
            -d output_project \
            --export-gradle \
            --deobf \
            --show-bad-code \
            --threads-count 4 \
            "$TARGET_APK"

          echo "Descompilación terminada."

          echo "Contenido generado:"
          ls -la output_project

      # --------------------------------------------------
      # 6. Saneamiento del código
      # --------------------------------------------------
      - name: 6. Saneamiento Inteligente del Código
        run: |
          set -e

          if [ -f scripts/post_process.py ]; then
            echo "Ejecutando post_process.py..."
            python3 scripts/post_process.py
          else
            echo "AVISO: scripts/post_process.py no existe."
            echo "Se continúa sin post-procesamiento."
          fi

      # --------------------------------------------------
      # 7. Recompilar APK
      # --------------------------------------------------
      - name: 7. Recompilar el Proyecto a un Nuevo APK con Gradle
        run: |
          set -e

          cd output_project

          echo "Contenido del proyecto:"
          ls -la

          if [ ! -f gradlew ]; then
            echo "ERROR: JADX no generó gradlew."
            echo "No se puede compilar como proyecto Gradle."
            exit 1
          fi

          chmod +x gradlew

          echo "Compilando proyecto..."

          ./gradlew assembleDebug --stacktrace

          echo "Compilación terminada."

      # --------------------------------------------------
      # 8. Subir APK como Artifact
      # --------------------------------------------------
      - name: 8. Subir el APK Recompilado como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-apk
          path: output_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # --------------------------------------------------
      # 9. Sincronizar código fuente
      # --------------------------------------------------
      - name: 9. Sincronizar Código Fuente al Repositorio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add output_project/

          git status

          if git diff-index --quiet HEAD; then
            echo "No hay cambios nuevos que commitear."
          else
            git commit -m "feat: Update decompiled source code [Automated CI]"
            git push origin HEAD:main
          fi
