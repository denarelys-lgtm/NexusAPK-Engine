name: NexusAPK Pipeline

on:
  push:
    paths:
      - 'input_apk/**'
      - '.github/workflows/decompiler.yml'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  process-apk:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================
      - name: 1. Checkout del Repositorio
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 17
      # ==================================================
      - name: 2. Configurar Entorno Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==================================================
      # 3. INSTALAR JADX
      # ==================================================
      - name: 3. Instalar JADX
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          INSTALACIÓN DE JADX"
          echo "=========================================="

          JADX_TAG=$(curl -fsSL \
            "https://api.github.com/repos/skylot/jadx/releases/latest" \
            | grep '"tag_name"' \
            | head -1 \
            | cut -d '"' -f 4)

          if [ -z "$JADX_TAG" ]; then
            echo "ERROR: No se pudo detectar JADX."
            exit 1
          fi

          JADX_VERSION="${JADX_TAG#v}"

          echo "Tag: $JADX_TAG"
          echo "Versión: $JADX_VERSION"

          JADX_URL="https://github.com/skylot/jadx/releases/download/${JADX_TAG}/jadx-${JADX_VERSION}.zip"

          wget \
            --show-progress \
            -O "jadx-${JADX_VERSION}.zip" \
            "$JADX_URL"

          rm -rf jadx-tool

          unzip -q \
            "jadx-${JADX_VERSION}.zip" \
            -d jadx-tool

          chmod +x jadx-tool/bin/jadx

          export PATH="$GITHUB_WORKSPACE/jadx-tool/bin:$PATH"

          echo "$GITHUB_WORKSPACE/jadx-tool/bin" >> "$GITHUB_PATH"

          echo ""
          echo "JADX instalado:"
          command -v jadx
          jadx --version


      # ==================================================
      # 4. DESCARGAR APK
      # ==================================================
      - name: 4. Descargar APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "           DESCARGA DEL APK"
          echo "=========================================="

          mkdir -p input_apk

          APK_URL="https://github.com/denarelys-lgtm/NexusAPK-Engine/releases/download/Apk/tu_app.apk"

          wget \
            --show-progress \
            -O input_apk/app.target.apk \
            "$APK_URL"

          if [ ! -s input_apk/app.target.apk ]; then
            echo "ERROR: APK no descargado."
            exit 1
          fi

          echo ""
          echo "APK descargado:"
          ls -lh input_apk/app.target.apk


      # ==================================================
      # 5. DESCOMPILAR APK
      # ==================================================
      - name: 5. Descompilar APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          DESCOMPILANDO APK"
          echo "=========================================="

          export PATH="$GITHUB_WORKSPACE/jadx-tool/bin:$PATH"

          rm -rf output_project

          set +e

          jadx \
            -d output_project \
            --export-gradle \
            --deobf \
            --show-bad-code \
            --threads-count 4 \
            input_apk/app.target.apk

          JADX_EXIT=$?

          set -e

          echo ""
          echo "=========================================="
          echo "          RESULTADO DE JADX"
          echo "=========================================="

          echo "Código de salida: $JADX_EXIT"

          if [ ! -d output_project ]; then
            echo "ERROR: No existe output_project."
            exit 1
          fi

          FILE_COUNT=$(find output_project -type f | wc -l)

          echo "Archivos generados: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: output_project está vacío."
            exit 1
          fi

          if [ "$JADX_EXIT" -ne 0 ]; then
            echo ""
            echo "AVISO: JADX terminó con errores."
            echo "El proyecto generado será procesado igualmente."
          fi

          echo ""
          echo "Estructura principal:"

          [ -f output_project/build.gradle ] \
            && echo "OK: output_project/build.gradle" \
            || echo "AVISO: falta output_project/build.gradle"

          [ -f output_project/app/build.gradle ] \
            && echo "OK: output_project/app/build.gradle" \
            || echo "AVISO: falta output_project/app/build.gradle"

          [ -f output_project/settings.gradle ] \
            && echo "OK: output_project/settings.gradle" \
            || echo "AVISO: falta output_project/settings.gradle"


      # ==================================================
      # 6. INSPECCIONAR PROYECTO
      # ==================================================
      - name: 6. Inspeccionar Proyecto Gradle
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "       INSPECCIÓN DEL PROYECTO"
          echo "=========================================="

          echo ""
          echo "------------------------------------------"
          echo "settings.gradle"
          echo "------------------------------------------"

          if [ -f output_project/settings.gradle ]; then
            cat output_project/settings.gradle
          else
            echo "No existe settings.gradle"
          fi


          echo ""
          echo "------------------------------------------"
          echo "build.gradle PRINCIPAL"
          echo "------------------------------------------"

          if [ -f output_project/build.gradle ]; then
            cat output_project/build.gradle
          else
            echo "No existe build.gradle"
          fi


          echo ""
          echo "------------------------------------------"
          echo "app/build.gradle"
          echo "------------------------------------------"

          if [ -f output_project/app/build.gradle ]; then
            cat output_project/app/build.gradle
          else
            echo "No existe app/build.gradle"
          fi


          echo ""
          echo "------------------------------------------"
          echo "gradle.properties EXISTENTE"
          echo "------------------------------------------"

          if [ -f output_project/gradle.properties ]; then
            cat output_project/gradle.properties
          else
            echo "No existe gradle.properties"
          fi


      # ==================================================
      # 7. INSTALAR GRADLE 8.11.1
      # ==================================================
      - name: 7. Instalar Gradle 8.11.1
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          INSTALANDO GRADLE"
          echo "=========================================="

          GRADLE_VERSION="8.11.1"

          echo "Versión seleccionada: $GRADLE_VERSION"

          wget \
            --show-progress \
            -O gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          rm -rf "$HOME/gradle"

          mkdir -p "$HOME/gradle"

          unzip -q \
            gradle.zip \
            -d "$HOME/gradle"

          export GRADLE_HOME="$HOME/gradle/gradle-${GRADLE_VERSION}"

          export PATH="$GRADLE_HOME/bin:$PATH"

          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"

          echo ""
          echo "Gradle instalado en:"
          echo "$GRADLE_HOME"

          echo ""
          gradle --version


      # ==================================================
      # 8. CONFIGURAR MEMORIA Y GENERAR WRAPPER
      # ==================================================
      - name: 8. Configurar Gradle y generar Wrapper
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "    CONFIGURANDO MEMORIA DE GRADLE"
          echo "=========================================="

          export GRADLE_HOME="$HOME/gradle/gradle-8.11.1"
          export PATH="$GRADLE_HOME/bin:$PATH"

          cd output_project

          echo ""
          echo "Creando gradle.properties..."

          cat > gradle.properties <<'PROPERTIES'
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon=false
android.useAndroidX=true
android.enableJetifier=true
PROPERTIES

          echo ""
          echo "Contenido de gradle.properties:"
          cat gradle.properties

          echo ""
          echo "=========================================="
          echo "       GENERANDO GRADLE WRAPPER"
          echo "=========================================="

          gradle wrapper \
            --gradle-version 8.11.1 \
            --distribution-type bin

          if [ ! -f gradlew ]; then
            echo "ERROR: No se pudo generar gradlew."
            exit 1
          fi

          chmod +x gradlew

          echo ""
          echo "Wrapper generado correctamente."

          ls -lh gradlew

          echo ""
          echo "Archivos del wrapper:"

          find gradle -type f -print

          echo ""
          echo "Versión del wrapper:"

          ./gradlew --version


      # ==================================================
      # 9. POST-PROCESAMIENTO
      # ==================================================
      - name: 9. Saneamiento del Código
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "        POST-PROCESAMIENTO"
          echo "=========================================="

          if [ -f scripts/post_process.py ]; then

            python3 scripts/post_process.py

          else

            echo "AVISO: scripts/post_process.py no existe."

          fi


      # ==================================================
      # 10. RECOMPILAR APK
      # ==================================================
      - name: 10. Recompilar APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "          RECOMPILANDO APK"
          echo "=========================================="

          if [ ! -d output_project ]; then
            echo "ERROR: No existe output_project."
            exit 1
          fi

          cd output_project

          if [ ! -f gradlew ]; then
            echo "ERROR: No existe gradlew."
            exit 1
          fi

          chmod +x gradlew

          echo ""
          echo "Memoria configurada:"
          cat gradle.properties

          echo ""
          echo "Versión del Gradle Wrapper:"

          ./gradlew --version

          echo ""
          echo "=========================================="
          echo "          INICIANDO COMPILACIÓN"
          echo "=========================================="

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --max-workers=2 \
            --stacktrace

          echo ""
          echo "=========================================="
          echo "       COMPILACIÓN TERMINADA"
          echo "=========================================="

          echo ""
          echo "APKs encontrados:"

          find . \
            -type f \
            -name "*.apk" \
            -print


      # ==================================================
      # 11. VERIFICAR APK
      # ==================================================
      - name: 11. Verificar APK generado
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "        VERIFICANDO APK"
          echo "=========================================="

          APK_PATH="output_project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: No se encontró el APK esperado:"
            echo "$APK_PATH"
            exit 1
          fi

          echo ""
          echo "APK generado correctamente:"
          ls -lh "$APK_PATH"

          echo ""
          echo "Tamaño:"
          du -h "$APK_PATH"


      # ==================================================
      # 12. SUBIR APK COMO ARTIFACT
      # ==================================================
      - name: 12. Subir APK Recompilado
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-apk
          path: output_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


      # ==================================================
      # 13. SINCRONIZAR CÓDIGO FUENTE
      # ==================================================
      - name: 13. Sincronizar Código Fuente
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "       SINCRONIZANDO CÓDIGO"
          echo "=========================================="

          git config \
            --global \
            user.name \
            "github-actions[bot]"

          git config \
            --global \
            user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add output_project/

          echo ""
          echo "Estado de Git:"

          git status

          if git diff-index --quiet HEAD; then

            echo ""
            echo "No hay cambios nuevos que commitear."

          else

            echo ""
            echo "Creando commit..."

            git commit \
              -m "feat: Update decompiled source code [Automated CI]"

            echo ""
            echo "Subiendo cambios..."

            git push origin HEAD:main

          fi

          echo ""
          echo "=========================================="
          echo "        WORKFLOW TERMINADO"
          echo "=========================================="
