name: Tango Creative v2 - Gradle Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK env
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: Download rebuild1.zip
        run: |
          set -e
          wget --show-progress --fail --tries=3 --waitretry=5 \
            -O source.zip \
            "https://github.com/denarelys-lgtm/NexusAPK-Engine/releases/download/build1/rebuild1.zip"
          test -s source.zip
          ls -lh source.zip

      - name: Extract
        run: |
          rm -rf source && mkdir -p source
          unzip -q source.zip -d source
          find source -maxdepth 4 -type f | sort | head -300

      - name: Detect Gradle project
        run: |
          SETTINGS=$(find source -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n1)
          [ -n "$SETTINGS" ] || { echo "No settings.gradle"; exit 1; }
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build Debug
        run: |
          cd "$PROJECT_DIR"
          if [ -x ./gradlew ]; then GRADLE=./gradlew; else GRADLE=gradle; fi
          $GRADLE --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" | head -n1)
          [ -n "$APK" ] || { echo "No APK"; exit 1; }
          cp "$APK" tango-creative-live-debug.apk
          ls -lh tango-creative-live-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tango-creative-live-v2-debug
          path: tango-creative-live-debug.apk
          if-no-files-found: error
          retention-days: 7
