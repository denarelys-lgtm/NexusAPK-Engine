name: Tango Creative v2 - Gradle Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 17
      # ==================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # 3. ANDROID SDK
      # ==================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Importante:
          # No pedir "tools" ni otros paquetes antiguos.
          packages: ''


      # ==================================================
      # 4. CONFIGURAR ANDROID SDK
      # ==================================================

      - name: Configure Android SDK environment
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          echo "ANDROID_HOME=$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"


      # ==================================================
      # 5. INSTALAR ANDROID API 36
      # ==================================================

      - name: Install Android SDK API 36
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ACEPTANDO LICENCIAS ANDROID"
          echo "=========================================="

          yes | sdkmanager --licenses > /dev/null || true

          echo
          echo "=========================================="
          echo "INSTALANDO ANDROID API 36"
          echo "=========================================="

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo
          echo "=========================================="
          echo "ANDROID SDK INSTALADO"
          echo "=========================================="

          sdkmanager --list_installed | head -200


      # ==================================================
      # 6. DESCARGAR EL ZIP REAL
      # ==================================================

      - name: Download rebuild1.zip
        shell: bash
        run: |
          set -e

          URL="https://github.com/denarelys-lgtm/NexusAPK-Engine/releases/download/build1/rebuild1.zip"

          echo "=========================================="
          echo "DESCARGANDO PROYECTO"
          echo "=========================================="

          echo "$URL"
          echo

          curl \
            --fail \
            --location \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 900 \
            --output source.zip \
            "$URL"

          if [ ! -s source.zip ]; then
            echo "ERROR: source.zip está vacío."
            exit 1
          fi

          echo
          echo "ZIP descargado correctamente:"
          ls -lh source.zip


      # ==================================================
      # 7. VERIFICAR ZIP
      # ==================================================

      - name: Verify ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFICANDO ZIP"
          echo "=========================================="

          unzip -t source.zip

          echo
          echo "ZIP válido."


      # ==================================================
      # 8. EXTRAER ZIP
      # ==================================================

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          unzip -q source.zip -d source

          echo "=========================================="
          echo "ESTRUCTURA DEL PROYECTO"
          echo "=========================================="

          find source \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -500


      # ==================================================
      # 9. DETECTAR PROYECTO GRADLE
      # ==================================================

      - name: Detect Gradle project
        shell: bash
        run: |
          set -e

          echo "Buscando settings.gradle..."

          SETTINGS=$(find source \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo
            echo "ERROR: No se encontró settings.gradle."
            echo

            find source \
              -maxdepth 6 \
              -type f \
              | sort \
              | head -1000

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo
          echo "=========================================="
          echo "PROYECTO ENCONTRADO"
          echo "=========================================="

          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==================================================
      # 10. VALIDAR PROYECTO ANDROID
      # ==================================================

      - name: Validate Android project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VALIDANDO PROYECTO ANDROID"
          echo "=========================================="

          echo "Proyecto:"
          echo "$PROJECT_DIR"

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Encontrado: app/build.gradle"

          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Encontrado: app/build.gradle.kts"

          else
            echo
            echo "ERROR: No se encontró app/build.gradle."

            find "$PROJECT_DIR" \
              -maxdepth 5 \
              -type f \
              | sort \
              | head -1000

            exit 1
          fi


      # ==================================================
      # 11. MANIFEST
      # ==================================================

      - name: Validate AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: No se encontró:"
            echo "$MANIFEST"
            exit 1
          fi

          echo "AndroidManifest encontrado."


      # ==================================================
      # 12. MOSTRAR compileSdk / targetSdk
      # ==================================================

      - name: Inspect Android SDK configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CONFIGURACIÓN ANDROID"
          echo "=========================================="

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            grep -nEi \
              "compileSdk|targetSdk|minSdk|buildToolsVersion" \
              "$PROJECT_DIR/app/build.gradle" \
              || true

          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            grep -nEi \
              "compileSdk|targetSdk|minSdk|buildToolsVersion" \
              "$PROJECT_DIR/app/build.gradle.kts" \
              || true
          fi

          echo
          echo "SDK instalado:"

          sdkmanager --list_installed \
            | grep -E \
              "platforms;android-36|build-tools;36.0.0|platform-tools" \
            || true


      # ==================================================
      # 13. CORREGIR values-iw -> values-he
      # ==================================================

      - name: Normalize legacy Hebrew values-iw resources
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "NORMALIZANDO values-iw"
          echo "=========================================="

          FOUND=0

          while IFS= read -r DIR; do
            FOUND=1

            echo
            echo "Encontrado:"
            echo "$DIR"

            PARENT="$(dirname "$DIR")"
            TARGET="$PARENT/values-he"

            if [ -d "$TARGET" ]; then
              echo "Ya existe:"
              echo "$TARGET"

              echo "No se sobrescribirá."

              echo
              echo "Contenido de values-iw:"
              find "$DIR" \
                -maxdepth 1 \
                -type f \
                -print \
                | sort

            else
              echo "Migrando:"
              echo "$DIR"
              echo "->"
              echo "$TARGET"

              mv "$DIR" "$TARGET"

              echo "Migración completada."
            fi

          done < <(
            find "$PROJECT_DIR" \
              -type d \
              -name "values-iw" \
              -print
          )

          if [ "$FOUND" -eq 0 ]; then
            echo "No existe values-iw."
          fi


      # ==================================================
      # 14. DETECTOR AUTOMÁTICO DE ]]> EN XML
      # ==================================================

      - name: Detect invalid XML CDATA sequence
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DETECTANDO SECUENCIA ]]> EN XML"
          echo "=========================================="

          REPORT="$GITHUB_WORKSPACE/xml-cdata-report.txt"

          : > "$REPORT"

          FOUND=0

          while IFS= read -r FILE; do

            if grep -nF "]]>" "$FILE" > /tmp/xml-match.txt; then
              FOUND=1

              echo "------------------------------------------" | tee -a "$REPORT"
              echo "ARCHIVO: $FILE" | tee -a "$REPORT"
              echo "------------------------------------------" | tee -a "$REPORT"

              cat /tmp/xml-match.txt | tee -a "$REPORT"

              echo | tee -a "$REPORT"
            fi

          done < <(
            find "$PROJECT_DIR/app/src" \
              -type f \
              -name "*.xml" \
              -print
          )

          echo
          echo "=========================================="

          if [ "$FOUND" -eq 1 ]; then
            echo "SE ENCONTRARON SECUENCIAS ]]>."
            echo
            echo "Reporte:"
            cat "$REPORT"
          else
            echo "No se encontró ]]> en los XML de app/src."
          fi

          echo "=========================================="

          # Este paso es diagnóstico.
          # No detenemos todavía la compilación porque ]]>
          # puede aparecer legítimamente como cierre de CDATA.
          exit 0


      # ==================================================
      # 15. VALIDAR XML CON xmllint
      # ==================================================

      - name: Validate XML resources
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "VALIDANDO XML"
          echo "=========================================="

          if ! command -v xmllint >/dev/null 2>&1; then
            echo "xmllint no está disponible."
            echo "Instalando libxml2-utils..."

            sudo apt-get update
            sudo apt-get install -y libxml2-utils
          fi

          REPORT="$GITHUB_WORKSPACE/xml-validation-report.txt"

          : > "$REPORT"

          INVALID=0

          while IFS= read -r FILE; do

            if ! xmllint --noout "$FILE" >> "$REPORT" 2>&1; then
              INVALID=1

              echo
              echo "=========================================="
              echo "XML INVÁLIDO"
              echo "=========================================="

              echo "$FILE"

              cat "$REPORT" | tail -30
            fi

          done < <(
            find "$PROJECT_DIR/app/src" \
              -type f \
              -name "*.xml" \
              -print
          )

          echo
          echo "=========================================="

          if [ "$INVALID" -eq 1 ]; then
            echo "SE ENCONTRARON XML INVÁLIDOS."
            echo
            echo "Reporte completo:"
            cat "$REPORT"

            echo
            echo "No se modifica automáticamente el XML."
            echo "Esto evita destruir recursos válidos."
          else
            echo "Todos los XML de app/src son válidos."
          fi

          echo "=========================================="

          # Diagnóstico únicamente.
          exit 0


      # ==================================================
      # 16. INSPECCIONAR values-iw / values-he
      # ==================================================

      - name: Inspect Hebrew plural resources
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSPECCIÓN DE RECURSOS HEBREOS"
          echo "=========================================="

          find "$PROJECT_DIR/app/src" \
            -type d \
            \( \
              -name "values-iw" \
              -o \
              -name "values-he" \
            \) \
            -print

          echo
          echo "Archivos XML relacionados con plurals:"

          find "$PROJECT_DIR/app/src" \
            -type f \
            -name "*.xml" \
            \( \
              -path "*/values-iw/*" \
              -o \
              -path "*/values-he/*" \
            \) \
            -print \
            | sort

          echo
          echo "Contenido de archivos plurals encontrados:"

          find "$PROJECT_DIR/app/src" \
            -type f \
            -name "*.xml" \
            \( \
              -path "*/values-iw/*" \
              -o \
              -path "*/values-he/*" \
            \) \
            -print \
            | while read -r FILE; do

              if grep -qiE \
                "<plurals|<item" \
                "$FILE"; then

                echo
                echo "------------------------------------------"
                echo "$FILE"
                echo "------------------------------------------"

                grep -nEi \
                  "<plurals|<item" \
                  "$FILE" \
                  | head -200 \
                  || true
              fi

            done


      # ==================================================
      # 17. GRADLE
      # ==================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"


      # ==================================================
      # 18. INFORMACIÓN DEL ENTORNO
      # ==================================================

      - name: Show build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          gradle --version

          echo
          echo "=========================================="
          echo "ANDROID"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "=========================================="
          echo "SDKMANAGER"
          echo "=========================================="

          sdkmanager --version

          echo
          echo "=========================================="
          echo "SDK INSTALADO"
          echo "=========================================="

          sdkmanager --list_installed | head -250


      # ==================================================
      # 19. INSPECCIONAR GRADLE
      # ==================================================

      - name: Inspect Gradle configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SETTINGS"
          echo "=========================================="

          if [ -f "$PROJECT_DIR/settings.gradle" ]; then
            cat "$PROJECT_DIR/settings.gradle"

          elif [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            cat "$PROJECT_DIR/settings.gradle.kts"
          fi

          echo
          echo "=========================================="
          echo "ROOT BUILD"
          echo "=========================================="

          if [ -f "$PROJECT_DIR/build.gradle" ]; then
            cat "$PROJECT_DIR/build.gradle"

          elif [ -f "$PROJECT_DIR/build.gradle.kts" ]; then
            cat "$PROJECT_DIR/build.gradle.kts"
          fi

          echo
          echo "=========================================="
          echo "APP BUILD"
          echo "=========================================="

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            cat "$PROJECT_DIR/app/build.gradle"

          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            cat "$PROJECT_DIR/app/build.gradle.kts"
          fi


      # ==================================================
      # 20. INSPECCIONAR DEPENDENCIAS
      # ==================================================

      - name: Inspect Gradle dependencies
        shell: bash
        run: |
          set +e

          cd "$PROJECT_DIR"

          if [ -x ./gradlew ]; then

            ./gradlew \
              --no-daemon \
              --stacktrace \
              :app:dependencies

            STATUS=$?

          else

            gradle \
              --no-daemon \
              --stacktrace \
              :app:dependencies

            STATUS=$?

          fi

          echo
          echo "Dependency inspection exit code: $STATUS"

          # Es una inspección.
          # No bloquea la compilación.
          exit 0


      # ==================================================
      # 21. PRE-BUILD RESOURCE CHECK
      # ==================================================

      - name: Pre-build resource diagnostics
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PRE-BUILD RESOURCE CHECK"
          echo "=========================================="

          echo
          echo "Cantidad de XML en app/src:"
          find "$PROJECT_DIR/app/src" \
            -type f \
            -name "*.xml" \
            | wc -l

          echo
          echo "Archivos values:"
          find "$PROJECT_DIR/app/src" \
            -type d \
            -name "values*" \
            | sort

          echo
          echo "Archivos plurals:"
          find "$PROJECT_DIR/app/src" \
            -type f \
            -name "*.xml" \
            -exec grep -l "<plurals" {} \; \
            | sort \
            || true


      # ==================================================
      # 22. COMPILAR APK
      # ==================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "INICIANDO COMPILACIÓN"
          echo "=========================================="

          if [ -x ./gradlew ]; then
            GRADLE="./gradlew"
          else
            GRADLE="gradle"
          fi

          echo "Gradle: $GRADLE"
          echo "Proyecto: $PROJECT_DIR"

          "$GRADLE" \
            --no-daemon \
            --stacktrace \
            --info \
            --warning-mode all \
            :app:assembleDebug


      # ==================================================
      # 23. LOCALIZAR APK
      # ==================================================

      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "APKS GENERADOS"
          echo "=========================================="

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print


      # ==================================================
      # 24. PREPARAR APK
      # ==================================================

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No se generó ningún APK."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp "$APK" tango-creative-live-debug.apk

          echo
          echo "APK preparado:"
          ls -lh tango-creative-live-debug.apk


      # ==================================================
      # 25. GUARDAR APK
      # ==================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tango-creative-live-v2-debug
          path: tango-creative-live-debug.apk
          if-no-files-found: error
          retention-days: 7


      # ==================================================
      # 26. GUARDAR REPORTES DE DIAGNÓSTICO
      # ==================================================

      - name: Upload XML diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tango-creative-v2-xml-diagnostics
          path: |
            xml-cdata-report.txt
            xml-validation-report.txt
          if-no-files-found: ignore
          retention-days: 7
