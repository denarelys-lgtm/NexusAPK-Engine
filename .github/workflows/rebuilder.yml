name: Tango Creative v2 - Gradle Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 17
      # ==================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # 3. ANDROID SDK
      # ==================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Configure Android SDK environment
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="
          echo "ANDROID_HOME=$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"


      # ==================================================
      # 4. INSTALAR ANDROID SDK
      # ==================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ACEPTANDO LICENCIAS ANDROID"
          echo "=========================================="

          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          echo
          echo "=========================================="
          echo "INSTALANDO SDK"
          echo "=========================================="

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

          echo
          echo "Android SDK instalado correctamente."


      # ==================================================
      # 5. DESCARGAR EL ZIP REAL
      # ==================================================

      - name: Download rebuild1.zip
        shell: bash
        run: |
          set -e

          URL="https://github.com/denarelys-lgtm/NexusAPK-Engine/releases/download/build1/rebuild1.zip"

          echo "=========================================="
          echo "DESCARGANDO PROYECTO"
          echo "=========================================="
          echo "$URL"
          echo

          curl \
            --fail \
            --location \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 900 \
            --output source.zip \
            "$URL"

          if [ ! -s source.zip ]; then
            echo "ERROR: source.zip está vacío."
            exit 1
          fi

          echo
          echo "ZIP descargado correctamente:"
          ls -lh source.zip


      # ==================================================
      # 6. VERIFICAR ZIP
      # ==================================================

      - name: Verify ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFICANDO ZIP"
          echo "=========================================="

          unzip -t source.zip

          echo
          echo "ZIP válido."


      # ==================================================
      # 7. EXTRAER ZIP
      # ==================================================

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          unzip -q source.zip -d source

          echo "=========================================="
          echo "ESTRUCTURA DEL PROYECTO"
          echo "=========================================="

          find source \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -400


      # ==================================================
      # 8. DETECTAR PROYECTO GRADLE
      # ==================================================

      - name: Detect Gradle project
        shell: bash
        run: |
          set -e

          echo "Buscando settings.gradle..."

          SETTINGS=$(find source \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo
            echo "ERROR: No se encontró settings.gradle."
            echo
            echo "Archivos encontrados:"

            find source \
              -maxdepth 5 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo
          echo "=========================================="
          echo "PROYECTO ENCONTRADO"
          echo "=========================================="

          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==================================================
      # 9. VALIDAR PROYECTO ANDROID
      # ==================================================

      - name: Validate Android project
        shell: bash
        run: |
          set -e

          echo "Proyecto:"
          echo "$PROJECT_DIR"

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Encontrado: app/build.gradle"

          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Encontrado: app/build.gradle.kts"

          else
            echo
            echo "ERROR: No se encontró app/build.gradle."

            find "$PROJECT_DIR" \
              -maxdepth 4 \
              -type f \
              | sort \
              | head -500

            exit 1
          fi


      # ==================================================
      # 10. MANIFEST
      # ==================================================

      - name: Validate AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: No se encontró:"
            echo "$MANIFEST"
            exit 1
          fi

          echo "AndroidManifest encontrado."


      # ==================================================
      # 10.5. PARCHEAR TODOS LOS RECURSOS 9-PATCH
      # ==================================================

      - name: Patch all 9-patch resources
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RENOMBRANDO TODOS LOS .9.png"
          echo "=========================================="

          RES_DIR="$PROJECT_DIR/app/src/main/res"

          if [ ! -d "$RES_DIR" ]; then
            echo "No se encontró directorio res/, saltando parche."
            exit 0
          fi

          echo "Archivos .9.png ANTES del parche:"
          find "$RES_DIR" -type f -name "*.9.png" | sort || true
          echo

          COUNT=0

          while IFS= read -r -d '' FILE; do
            NEW_FILE="${FILE%.9.png}.png"

            if [ -e "$NEW_FILE" ]; then
              NEW_FILE="${FILE%.9}_9patch.png"
            fi

            mv "$FILE" "$NEW_FILE"
            echo "→ $FILE"
            echo "  => $NEW_FILE"
            COUNT=$((COUNT + 1))
          done < <(find "$RES_DIR" -type f -name "*.9.png" -print0)

          echo
          echo "Total de archivos renombrados: $COUNT"

          echo
          echo "Archivos .9.png DESPUÉS del parche (debería estar vacío):"
          find "$RES_DIR" -type f -name "*.9.png" | sort || true

          echo
          echo "=========================================="
          echo "PARCHE COMPLETADO"
          echo "=========================================="


      # ==================================================
      # 10.6. DIAGNOSTICAR SECUENCIAS ]]> EN XML
      # ==================================================

      - name: Diagnose ]]> occurrences
        continue-on-error: true
        shell: bash
        run: |
          RES_DIR="$PROJECT_DIR/app/src/main/res"

          echo "=========================================="
          echo "ARCHIVOS XML CON SECUENCIA ]]>"
          echo "=========================================="

          grep -rn ']]>' "$RES_DIR" \
            --include="*.xml" \
            | head -50 || echo "No se encontraron ocurrencias."


      # ==================================================
      # 10.7. PARCHEAR SECUENCIAS ]]> EN XML
      # ==================================================

      - name: Fix unescaped ]]> in XML
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CORRIGIENDO SECUENCIAS ]]> SIN ESCAPAR"
          echo "=========================================="

          RES_DIR="$PROJECT_DIR/app/src/main/res"

          if [ ! -d "$RES_DIR" ]; then
            echo "No hay res/, saltando."
            exit 0
          fi

          COUNT=0

          while IFS= read -r -d '' FILE; do
            if grep -q ']]>' "$FILE"; then
              echo
              echo "→ Corrigiendo: $FILE"
              grep -n ']]>' "$FILE" | head -10

              sed -i 's/]]>/]]\&gt;/g' "$FILE"

              echo "  → Reemplazado."
              COUNT=$((COUNT + 1))
            fi
          done < <(find "$RES_DIR" -type f -name "*.xml" -print0)

          echo
          echo "Total archivos corregidos: $COUNT"

          echo
          echo "=========================================="
          echo "PARCHE COMPLETADO"
          echo "=========================================="


      # ==================================================
      # 10.8. LIMPIAR INTERMEDIOS RESIDUALES
      # ==================================================

      - name: Clean stale intermediates
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf app/build/intermediates/incremental \
                 app/build/intermediates/merged_res \
                 app/build/intermediates/merged_res_blame_folder

          echo "Intermedios limpiados."


      # ==================================================
      # 11. GRADLE
      # ==================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"


      # ==================================================
      # 12. INFORMACIÓN DEL ENTORNO
      # ==================================================

      - name: Show build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="
          java -version

          echo
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="
          gradle --version

          echo
          echo "=========================================="
          echo "ANDROID"
          echo "=========================================="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo
          echo "=========================================="
          echo "SDKMANAGER"
          echo "=========================================="
          sdkmanager --version

          echo
          echo "=========================================="
          echo "ANDROID SDK PACKAGES"
          echo "=========================================="
          sdkmanager --list_installed | head -200


      # ==================================================
      # 13. INSPECCIONAR CONFIGURACIÓN
      # ==================================================

      - name: Inspect Gradle configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SETTINGS"
          echo "=========================================="

          if [ -f "$PROJECT_DIR/settings.gradle" ]; then
            cat "$PROJECT_DIR/settings.gradle"
          elif [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            cat "$PROJECT_DIR/settings.gradle.kts"
          fi

          echo
          echo "=========================================="
          echo "ROOT BUILD"
          echo "=========================================="

          if [ -f "$PROJECT_DIR/build.gradle" ]; then
            cat "$PROJECT_DIR/build.gradle"
          elif [ -f "$PROJECT_DIR/build.gradle.kts" ]; then
            cat "$PROJECT_DIR/build.gradle.kts"
          fi

          echo
          echo "=========================================="
          echo "APP BUILD"
          echo "=========================================="

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            cat "$PROJECT_DIR/app/build.gradle"
          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            cat "$PROJECT_DIR/app/build.gradle.kts"
          fi


      # ==================================================
      # 14. DEPENDENCIAS (informativo, no bloqueante)
      # ==================================================

      - name: Inspect Gradle dependencies
        continue-on-error: true
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            GRADLE="./gradlew"
          else
            GRADLE="gradle"
          fi

          "$GRADLE" \
            --no-daemon \
            --stacktrace \
            :app:dependencies \
            --configuration debugRuntimeClasspath | head -200


      # ==================================================
      # 15. COMPILAR APK
      # ==================================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "INICIANDO COMPILACIÓN"
          echo "=========================================="

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            GRADLE="./gradlew"
          else
            GRADLE="gradle"
          fi

          "$GRADLE" \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug


      # ==================================================
      # 16. LOCALIZAR APK
      # ==================================================

      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "APKS GENERADOS"
          echo "=========================================="

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print || true


      # ==================================================
      # 17. PREPARAR APK
      # ==================================================

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No se generó ningún APK."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp "$APK" tango-creative-live-debug.apk

          echo
          echo "APK preparado:"
          ls -lh tango-creative-live-debug.apk


      # ==================================================
      # 18. SUBIR APK
      # ==================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tango-creative-live-v2-debug
          path: tango-creative-live-debug.apk
          if-no-files-found: error
          retention-days: 7
