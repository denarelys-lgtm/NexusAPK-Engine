name: Tango Creative v2 - Gradle Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ==================================================
      # 1. CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. JAVA 17
      # ==================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # 3. ANDROID SDK
      # ==================================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Configure Android SDK environment
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="
          echo "ANDROID_HOME=$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT"


      # ==================================================
      # 4. INSTALAR ANDROID SDK
      # ==================================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ACEPTANDO LICENCIAS ANDROID"
          echo "=========================================="

          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          echo
          echo "=========================================="
          echo "INSTALANDO SDK"
          echo "=========================================="

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0"

          echo
          echo "Android SDK instalado correctamente."


      # ==================================================
      # 5. DESCARGAR EL ZIP
      # ==================================================

      - name: Download rebuild1.zip
        shell: bash
        run: |
          set -e

          URL="https://github.com/denarelys-lgtm/NexusAPK-Engine/releases/download/build1/rebuild1.zip"

          echo "=========================================="
          echo "DESCARGANDO PROYECTO"
          echo "=========================================="
          echo "$URL"
          echo

          curl \
            --fail \
            --location \
            --show-error \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 30 \
            --max-time 900 \
            --output source.zip \
            "$URL"

          if [ ! -s source.zip ]; then
            echo "ERROR: source.zip está vacío."
            exit 1
          fi

          echo
          echo "ZIP descargado correctamente:"
          ls -lh source.zip


      # ==================================================
      # 6. VERIFICAR ZIP
      # ==================================================

      - name: Verify ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFICANDO ZIP"
          echo "=========================================="

          unzip -t source.zip

          echo
          echo "ZIP válido."


      # ==================================================
      # 7. EXTRAER ZIP
      # ==================================================

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          unzip -q source.zip -d source

          echo "=========================================="
          echo "ESTRUCTURA DEL PROYECTO"
          echo "=========================================="

          find source \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -400


      # ==================================================
      # 8. DETECTAR PROYECTO GRADLE
      # ==================================================

      - name: Detect Gradle project
        shell: bash
        run: |
          set -e

          echo "Buscando settings.gradle..."

          SETTINGS=$(find source \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo
            echo "ERROR: No se encontró settings.gradle."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo
          echo "=========================================="
          echo "PROYECTO ENCONTRADO"
          echo "=========================================="
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ==================================================
      # 9. VALIDAR PROYECTO ANDROID
      # ==================================================

      - name: Validate Android project
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Encontrado: app/build.gradle"
          elif [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Encontrado: app/build.gradle.kts"
          else
            echo "ERROR: No se encontró app/build.gradle."
            exit 1
          fi


      # ==================================================
      # 10. MANIFEST
      # ==================================================

      - name: Validate AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: No se encontró:"
            echo "$MANIFEST"
            exit 1
          fi

          echo "AndroidManifest encontrado."


      # ==================================================
      # 10.5. PARCHEAR TODOS LOS RECURSOS 9-PATCH
      # ==================================================

      - name: Patch all 9-patch resources
        shell: bash
        run: |
          set -e

          RES_DIR="$PROJECT_DIR/app/src/main/res"

          if [ ! -d "$RES_DIR" ]; then
            echo "No se encontró res/, saltando."
            exit 0
          fi

          COUNT=0

          while IFS= read -r -d '' FILE; do
            NEW_FILE="${FILE%.9.png}.png"
            if [ -e "$NEW_FILE" ]; then
              NEW_FILE="${FILE%.9}_9patch.png"
            fi
            mv "$FILE" "$NEW_FILE"
            COUNT=$((COUNT + 1))
          done < <(find "$RES_DIR" -type f -name "*.9.png" -print0)

          echo "Total .9.png renombrados: $COUNT"


      # ==================================================
      # 10.6. DIAGNOSTICAR ]]> EN XML
      # ==================================================

      - name: Diagnose ]]> occurrences
        continue-on-error: true
        shell: bash
        run: |
          RES_DIR="$PROJECT_DIR/app/src/main/res"
          grep -rn ']]>' "$RES_DIR" --include="*.xml" | head -50 \
            || echo "No se encontraron ocurrencias."


      # ==================================================
      # 10.7. CORREGIR ]]> EN XML
      # ==================================================

      - name: Fix unescaped ]]> in XML
        shell: bash
        run: |
          set -e

          RES_DIR="$PROJECT_DIR/app/src/main/res"
          COUNT=0

          while IFS= read -r -d '' FILE; do
            if grep -q ']]>' "$FILE"; then
              sed -i 's/]]>/]]\&gt;/g' "$FILE"
              COUNT=$((COUNT + 1))
            fi
          done < <(find "$RES_DIR" -type f -name "*.xml" -print0)

          echo "Total archivos corregidos (]]>): $COUNT"


      # ==================================================
      # 10.8. CORREGIR <plurals> SIN quantity
      # ==================================================

      - name: Fix plurals without quantity attribute
        shell: bash
        run: |
          set -e

          RES_DIR="$PROJECT_DIR/app/src/main/res"

          python3 - "$RES_DIR" <<'PY'
          import re, sys
          from pathlib import Path

          res_dir = Path(sys.argv[1])
          VALID = ["other", "one", "few", "many", "two", "zero"]

          def fix_plurals_block(block):
              counter = {"i": 0}
              def fix_item(m):
                  full = m.group(0)
                  if re.search(r'\bquantity\s*=', full):
                      return full
                  idx = counter["i"]
                  q = VALID[idx] if idx < len(VALID) else "other"
                  counter["i"] += 1
                  if full.startswith("<item>"):
                      return f'<item quantity="{q}">'
                  return full.replace("<item", f'<item quantity="{q}"', 1)
              return re.sub(r'<item\b[^>]*>', fix_item, block)

          def fix_file(path):
              try:
                  text = path.read_text(encoding="utf-8")
              except Exception:
                  return False
              original = text
              text = re.sub(
                  r'<plurals\b[^>]*>.*?</plurals>',
                  lambda m: fix_plurals_block(m.group(0)),
                  text, flags=re.DOTALL,
              )
              if text != original:
                  path.write_text(text, encoding="utf-8")
                  return True
              return False

          count = 0
          for f in res_dir.rglob("*.xml"):
              if fix_file(f):
                  print(f"  Corregido: {f}")
                  count += 1
          print(f"Total archivos corregidos (plurals): {count}")
          PY


      # ==================================================
      # 10.9. LIMPIAR INTERMEDIOS
      # ==================================================

      - name: Clean stale intermediates
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          rm -rf app/build/intermediates/incremental \
                 app/build/intermediates/merged_res \
                 app/build/intermediates/merged_res_blame_folder
          echo "Intermedios limpiados."


      # ==================================================
      # 11. GRADLE
      # ==================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"


      # ==================================================
      # 12. INFORMACIÓN DEL ENTORNO
      # ==================================================

      - name: Show build environment
        shell: bash
        run: |
          set -e

          {
            echo "=== JAVA ==="
            java -version 2>&1
            echo
            echo "=== GRADLE ==="
            gradle --version 2>&1
            echo
            echo "=== ANDROID ==="
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo
            echo "=== SDKMANAGER ==="
            sdkmanager --version 2>&1
            echo
            echo "=== SDK PACKAGES ==="
            sdkmanager --list_installed 2>&1 | head -100
          } | tee "$GITHUB_WORKSPACE/environment.log"


      # ==================================================
      # 13. INSPECCIONAR CONFIGURACIÓN
      # ==================================================

      - name: Inspect Gradle configuration
        shell: bash
        run: |
          set -e

          {
            echo "=== SETTINGS ==="
            cat "$PROJECT_DIR/settings.gradle" 2>/dev/null \
              || cat "$PROJECT_DIR/settings.gradle.kts" 2>/dev/null \
              || echo "(no encontrado)"

            echo
            echo "=== ROOT BUILD ==="
            cat "$PROJECT_DIR/build.gradle" 2>/dev/null \
              || cat "$PROJECT_DIR/build.gradle.kts" 2>/dev/null \
              || echo "(no encontrado)"

            echo
            echo "=== APP BUILD ==="
            cat "$PROJECT_DIR/app/build.gradle" 2>/dev/null \
              || cat "$PROJECT_DIR/app/build.gradle.kts" 2>/dev/null \
              || echo "(no encontrado)"
          } | tee "$GITHUB_WORKSPACE/gradle-config.log"


      # ==================================================
      # 14. DEPENDENCIAS (informativo)
      # ==================================================

      - name: Inspect Gradle dependencies
        continue-on-error: true
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            GRADLE="./gradlew"
          else
            GRADLE="gradle"
          fi

          "$GRADLE" --no-daemon --stacktrace \
            :app:dependencies \
            --configuration debugRuntimeClasspath 2>&1 \
            | head -200 \
            | tee "$GITHUB_WORKSPACE/dependencies.log"


      # ==================================================
      # 15. COMPILAR APK (guarda log completo)
      # ==================================================

      - name: Build Debug APK
        id: build
        shell: bash
        run: |
          set -o pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "INICIANDO COMPILACIÓN"
          echo "=========================================="

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            GRADLE="./gradlew"
          else
            GRADLE="gradle"
          fi

          # Guardar TODO el output a un archivo Y mostrarlo en vivo
          "$GRADLE" \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"


      # ==================================================
      # 15.1. IMPRIMIR RESUMEN DEL FALLO (solo si falla)
      # ==================================================

      - name: Print failure summary
        if: failure()
        shell: bash
        run: |
          echo ""
          echo "##################################################"
          echo "#         RESUMEN DEL FALLO (copiar de aquí)     #"
          echo "##################################################"
          echo ""

          LOG="$GITHUB_WORKSPACE/build.log"

          if [ ! -f "$LOG" ]; then
            echo "No se encontró build.log."
            exit 0
          fi

          echo "===== FAILURE: WHAT WENT WRONG ====="
          awk '/^FAILURE:/{flag=1} flag{print} /^\* Try:/{if(flag)exit}' \
            "$LOG" | head -100

          echo ""
          echo "===== CAUSED BY (primeros 5) ====="
          grep -n "Caused by:" "$LOG" | head -5

          echo ""
          echo "===== ERROR/ERROR: LINES ====="
          grep -n "^ERROR:" "$LOG" | head -30

          echo ""
          echo "===== AAPT ERRORS ====="
          grep -n "AAPT:" "$LOG" | head -30

          echo ""
          echo "##################################################"
          echo "#              FIN DEL RESUMEN                   #"
          echo "##################################################"


      # ==================================================
      # 15.2. RECOLECTAR DIAGNÓSTICO (solo si falla)
      # ==================================================

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          DIAG="$GITHUB_WORKSPACE/diagnostics"
          mkdir -p "$DIAG"

          echo "Recolectando archivos en $DIAG..."

          # 1. Logs ya generados
          cp "$GITHUB_WORKSPACE/build.log"        "$DIAG/" 2>/dev/null
          cp "$GITHUB_WORKSPACE/environment.log"  "$DIAG/" 2>/dev/null
          cp "$GITHUB_WORKSPACE/gradle-config.log" "$DIAG/" 2>/dev/null
          cp "$GITHUB_WORKSPACE/dependencies.log" "$DIAG/" 2>/dev/null

          # 2. Archivos de configuración Gradle
          if [ -n "$PROJECT_DIR" ] && [ -d "$PROJECT_DIR" ]; then
            cp "$PROJECT_DIR/settings.gradle"        "$DIAG/settings.gradle"        2>/dev/null
            cp "$PROJECT_DIR/settings.gradle.kts"    "$DIAG/settings.gradle.kts"    2>/dev/null
            cp "$PROJECT_DIR/build.gradle"           "$DIAG/root-build.gradle"      2>/dev/null
            cp "$PROJECT_DIR/build.gradle.kts"       "$DIAG/root-build.gradle.kts"  2>/dev/null
            cp "$PROJECT_DIR/app/build.gradle"       "$DIAG/app-build.gradle"       2>/dev/null
            cp "$PROJECT_DIR/app/build.gradle.kts"   "$DIAG/app-build.gradle.kts"   2>/dev/null
            cp "$PROJECT_DIR/gradle.properties"      "$DIAG/gradle.properties"      2>/dev/null

            # 3. Todos los values/*.xml (sospechosos de tener errores XML)
            if [ -d "$PROJECT_DIR/app/src/main/res" ]; then
              mkdir -p "$DIAG/res-values"
              find "$PROJECT_DIR/app/src/main/res" \
                -type d -name "values*" \
                -exec cp -r {} "$DIAG/res-values/" \; 2>/dev/null

              # 4. Listado completo de recursos
              find "$PROJECT_DIR/app/src/main/res" -type f | sort \
                > "$DIAG/res-files.txt" 2>/dev/null
            fi

            # 5. Árbol de directorios del proyecto
            find "$PROJECT_DIR" -maxdepth 4 -type d | sort \
              > "$DIAG/project-tree.txt" 2>/dev/null
          fi

          # 6. Metadatos del run
          {
            echo "Run ID: ${{ github.run_id }}"
            echo "Run number: ${{ github.run_number }}"
            echo "SHA: ${{ github.sha }}"
            echo "Workflow: ${{ github.workflow }}"
            echo "Ref: ${{ github.ref }}"
            echo "Actor: ${{ github.actor }}"
            echo "Date: $(date -u)"
          } > "$DIAG/run-info.txt"

          echo
          echo "Contenido del directorio diagnostics:"
          ls -laR "$DIAG" | head -100


      # ==================================================
      # 15.3. SUBIR DIAGNÓSTICO (solo si falla)
      # ==================================================

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-diagnostics-${{ github.run_number }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14


      # ==================================================
      # 16. LOCALIZAR APK
      # ==================================================

      - name: Locate generated APK
        if: success()
        shell: bash
        run: |
          set -e

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print || true


      # ==================================================
      # 17. PREPARAR APK
      # ==================================================

      - name: Prepare APK artifact
        if: success()
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No se generó ningún APK."
            exit 1
          fi

          echo "APK encontrado: $APK"
          cp "$APK" tango-creative-live-debug.apk
          ls -lh tango-creative-live-debug.apk


      # ==================================================
      # 18. SUBIR APK
      # ==================================================

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tango-creative-live-v2-debug
          path: tango-creative-live-debug.apk
          if-no-files-found: error
          retention-days: 7
